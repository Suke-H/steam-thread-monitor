# .github/workflows/steam-monitor.yml
name: Steam Thread Monitor

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日UTC 0:00（日本時間 9:00）
  workflow_dispatch:       # 手動実行も可能

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch, compare, notify, and save post counts
        run: |
          IFS=',' read -ra URLS <<< "${{ vars.STEAM_THREAD_URLS }}"
          IFS=',' read -ra PREVS <<< "${{ vars.LAST_POST_COUNTS }}"
          NEW_COUNTS=()

          for i in "${!URLS[@]}"; do
            URL="${URLS[$i]}"
            PREV="${PREVS[$i]:-}"
            echo "--- チェック中: $URL ---"

            # 投稿数を取得する
            HTML=$(curl -s \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              "$URL")
            COUNT=$(echo "$HTML" | grep -oP '(?<=class="topicstats_value">)[0-9]+' | head -1)
            echo "取得した投稿数: $COUNT"

            if [ -z "$COUNT" ]; then
              echo "⚠️ 投稿数が取得できませんでした: $URL"
              NEW_COUNTS+=("${PREV}")
              continue
            fi

            echo "前回: $PREV / 今回: $COUNT"
            NEW_COUNTS+=("$COUNT")

            if [ "$PREV" = "$COUNT" ]; then
              echo "→ 変化なし"
              continue
            fi

            echo "→ 変化あり、通知します"

            # 通知を送る (Discord Webhook)
            curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"🔔 Steamスレッドの投稿数が増えました！ 現在: $COUNT 件\\n$URL\"}"
          done

          # 投稿数をまとめて保存する
          NEW_COUNTS_STR=$(IFS=','; echo "${NEW_COUNTS[*]}")
          echo "保存する投稿数: $NEW_COUNTS_STR"

          RESPONSE=$(curl -s --max-time 10 -X PATCH \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/LAST_POST_COUNTS" \
            -d "{\"name\":\"LAST_POST_COUNTS\",\"value\":\"$NEW_COUNTS_STR\"}")
          echo "PATCH response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"message"'; then
            RESPONSE2=$(curl -s --max-time 10 -X POST \
              -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/variables" \
              -d "{\"name\":\"LAST_POST_COUNTS\",\"value\":\"$NEW_COUNTS_STR\"}")
            echo "POST response: $RESPONSE2"
          fi