# .github/workflows/steam-monitor.yml
name: Steam Thread Monitor

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日UTC 0:00（日本時間 9:00）
  workflow_dispatch:       # 手動実行も可能

concurrency:
  group: steam-thread-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch post counts
        id: fetch
        run: |
          IFS=',' read -ra URLS <<< "${{ vars.STEAM_THREAD_URLS }}"
          COUNTS=()
          for i in "${!URLS[@]}"; do
            URL="${URLS[$i]}"
            echo "--- 取得中: $URL ---"
            HTML=$(curl -s \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              "$URL")
            COUNT=$(echo "$HTML" | grep -oP '(?<=class="topicstats_value">)[0-9]+' | head -1)
            echo "取得した投稿数: $COUNT"
            if [ -z "$COUNT" ]; then
              echo "⚠️ 投稿数が取得できませんでした: $URL"
              COUNTS+=("0")
            else
              COUNTS+=("$COUNT")
            fi
          done
          COUNTS_STR=$(IFS=','; echo "${COUNTS[*]}")
          echo "counts=$COUNTS_STR" >> $GITHUB_OUTPUT

      - name: Compare post counts
        id: compare
        run: |
          IFS=',' read -ra COUNTS <<< "${{ steps.fetch.outputs.counts }}"
          PREV_STR=$(jq -r '.counts // ""' data/last_post_counts.json 2>/dev/null || echo "")
          IFS=',' read -ra PREVS <<< "$PREV_STR"
          CHANGED_URLS=()
          CHANGED_COUNTS=()
          IFS=',' read -ra URLS <<< "${{ vars.STEAM_THREAD_URLS }}"
          for i in "${!COUNTS[@]}"; do
            COUNT="${COUNTS[$i]}"
            PREV="${PREVS[$i]:-}"
            URL="${URLS[$i]}"
            echo "前回: $PREV / 今回: $COUNT ($URL)"
            if [ "$PREV" != "$COUNT" ] && [ "$COUNT" != "0" ]; then
              echo "→ 変化あり"
              CHANGED_URLS+=("$URL")
              CHANGED_COUNTS+=("$COUNT")
            else
              echo "→ 変化なし"
            fi
          done
          CHANGED_URLS_STR=$(IFS=','; echo "${CHANGED_URLS[*]}")
          CHANGED_COUNTS_STR=$(IFS=','; echo "${CHANGED_COUNTS[*]}")
          echo "changed_urls=$CHANGED_URLS_STR" >> $GITHUB_OUTPUT
          echo "changed_counts=$CHANGED_COUNTS_STR" >> $GITHUB_OUTPUT

      - name: Notify
        if: steps.compare.outputs.changed_urls != ''
        run: |
          IFS=',' read -ra URLS <<< "${{ steps.compare.outputs.changed_urls }}"
          IFS=',' read -ra COUNTS <<< "${{ steps.compare.outputs.changed_counts }}"
          for i in "${!URLS[@]}"; do
            URL="${URLS[$i]}"
            COUNT="${COUNTS[$i]}"
            echo "→ 通知: $URL ($COUNT 件)"
            curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"🔔 Steamスレッドの投稿数が増えました！ 現在: $COUNT 件\\n$URL\"}"
          done

      - name: Save post counts
        run: |
          NEW_COUNTS_STR="${{ steps.fetch.outputs.counts }}"
          echo "保存する投稿数: $NEW_COUNTS_STR"
          mkdir -p data
          printf '{"counts":"%s","checked_at":"%s"}\n' \
            "$NEW_COUNTS_STR" "$(TZ='Asia/Tokyo' date +%Y-%m-%dT%H:%M:%S+09:00)" > data/last_post_counts.json
          git config user.name "Suke-H"
          git config user.email "34861353+Suke-H@users.noreply.github.com"
          git add data/last_post_counts.json
          TODAY=$(TZ='Asia/Tokyo' date +%Y-%m-%d)
          if [ -n "${{ steps.compare.outputs.changed_urls }}" ]; then
            MSG="🆕 Scheduled run ($TODAY): New post arrived!"
          else
            MSG="💤 Scheduled run ($TODAY): No new post arrived"
          fi
          git commit -m "$MSG"
          git push